name: Outbox Backend Auto Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

  workflow_dispatch:

concurrency:
  group: outbox-backend-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Backend to VPS-2
    runs-on: self-hosted

    steps:

      # ==========================================================
      # 1. Checkout Repository
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Verify Outbox Server
      #
      # No SSH needed — the runner IS the server, so these checks
      # run as plain local commands.
      # ==========================================================
      - name: Verify Outbox Server
        run: |
          set -e

          echo '======================================'
          echo 'Verifying Outbox Server'
          echo '======================================'

          echo 'Checking deployment directory...'
          test -d "${{ vars.DEPLOY_PATH }}"

          echo 'Checking backend directory...'
          test -d "${{ vars.DEPLOY_PATH }}/backend"

          echo 'Checking production .env...'
          test -f "${{ vars.DEPLOY_PATH }}/.env"

          echo 'Checking Docker Compose...'
          cd "${{ vars.DEPLOY_PATH }}"
          docker compose config --services | grep -qx 'outbox'

          echo ''
          echo 'Server verification successful.'

      # ==========================================================
      # 3. Sync Backend Only
      #
      # IMPORTANT:
      # - .env is NOT synced
      # - node_modules is NOT synced
      # - data is NOT synced
      # - db is NOT synced
      # - uploads is NOT synced
      # - --delete is NOT used
      #
      # No SSH transport needed — source (checkout) and destination
      # (DEPLOY_PATH) are both on this same machine.
      # ==========================================================
      - name: Sync Backend Source
        run: |
          rsync -a \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='data/' \
            --exclude='db/' \
            --exclude='uploads/' \
            backend/ \
            "${{ vars.DEPLOY_PATH }}/backend/"

      # ==========================================================
      # 4. Verify Protected Files
      # ==========================================================
      - name: Verify Protected Files
        run: |
          set -e

          echo '======================================'
          echo 'Verifying Protected Files'
          echo '======================================'

          echo 'Checking .env...'
          test -f "${{ vars.DEPLOY_PATH }}/.env"

          echo 'Checking data directory...'
          test -d "${{ vars.DEPLOY_PATH }}/backend/data"

          echo 'Checking database directory...'
          test -d "${{ vars.DEPLOY_PATH }}/backend/db"

          echo 'Checking uploads directory...'
          test -d "${{ vars.DEPLOY_PATH }}/backend/uploads"

          echo ''
          echo 'Protected files/directories are safe.'

      # ==========================================================
      # 5. Build Backend Docker Image
      # ==========================================================
      - name: Build Backend Docker Image
        run: |
          set -e
          cd "${{ vars.DEPLOY_PATH }}"

          echo '======================================'
          echo 'Building Outbox Backend'
          echo '======================================'

          docker compose build --no-cache outbox

      # ==========================================================
      # 6. Recreate Only Outbox Container
      # ==========================================================
      - name: Restart Backend Container
        run: |
          set -e
          cd "${{ vars.DEPLOY_PATH }}"

          echo '======================================'
          echo 'Restarting Outbox Backend'
          echo '======================================'

          docker compose up -d --force-recreate outbox

      # ==========================================================
      # 7. Verify Container
      # ==========================================================
      - name: Verify Backend Container
        run: |
          set -e
          cd "${{ vars.DEPLOY_PATH }}"

          echo '======================================'
          echo 'Outbox Backend Status'
          echo '======================================'

          docker compose ps outbox

          echo ''
          echo 'Container state:'
          docker inspect -f '{{.State.Status}}' outbox

          echo ''
          echo 'Checking production .env...'
          test -f "${{ vars.DEPLOY_PATH }}/.env"

          echo ''
          echo '======================================'
          echo 'Backend Deployment Successful'
          echo '======================================'
